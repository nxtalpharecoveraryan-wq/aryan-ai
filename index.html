<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARYAN AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#03050a;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
}

header{
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    letter-spacing:6px;
}

.subtitle{
    color:#6d7785;
    font-size:12px;
    margin-top:6px;
    letter-spacing:2px;
}

.core-area{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.core{
    width:190px;
    height:190px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:radial-gradient(
        circle,
        #183d69 0%,
        #0a1728 40%,
        #03050a 72%
    );
    box-shadow:
        0 0 25px #168cff,
        0 0 70px rgba(22,140,255,.45),
        inset 0 0 35px #168cff;
    animation:breathe 3s infinite;
}

.core::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border:1px solid #168cff;
    border-radius:50%;
    animation:rotate 8s linear infinite;
}

.core::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border:1px solid rgba(22,140,255,.3);
    border-radius:50%;
    animation:rotate 12s linear infinite reverse;
}

.eye{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#69c5ff;
    box-shadow:
        0 0 20px #168cff,
        0 0 50px #168cff;
}

.status{
    margin-top:50px;
    color:#55baff;
    font-size:14px;
}

.chat{
    height:145px;
    overflow-y:auto;
    padding:5px;
    margin-bottom:10px;
}

.message{
    max-width:85%;
    padding:10px 13px;
    margin:7px 0;
    border-radius:15px;
    font-size:14px;
    line-height:1.4;
}

.ai{
    background:#0d1725;
    border:1px solid #173758;
}

.user{
    background:#0967c7;
    margin-left:auto;
}

.controls{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    background:#0b1018;
    border:1px solid #243346;
    border-radius:25px;
    color:white;
    padding:14px;
    outline:none;
}

.send{
    width:52px;
    border-radius:50%;
    border:0;
    background:#0875e8;
    color:white;
    font-size:18px;
}

.mic{
    display:block;
    margin:14px auto 8px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:0;
    background:#0875e8;
    color:white;
    font-size:29px;
    box-shadow:0 0 25px rgba(8,117,232,.7);
}

.mic.listening{
    background:#e52b4c;
    box-shadow:0 0 35px rgba(229,43,76,.8);
    animation:micPulse 1s infinite;
}

footer{
    text-align:center;
    color:#4b5563;
    font-size:10px;
    padding-top:5px;
}

@keyframes breathe{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.06);
    }
}

@keyframes rotate{
    from{
        transform:rotate(0);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes micPulse{
    50%{
        transform:scale(1.12);
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">ARYAN AI</div>
    <div class="subtitle">PERSONAL VOICE ASSISTANT</div>
</header>

<div class="core-area">

    <div class="core">
        <div class="eye"></div>
    </div>

    <div class="status" id="status">
        Ready
    </div>

</div>

<div class="chat" id="chat">

    <div class="message ai">
        Hello! I am ARYAN AI. Tap the microphone and give me a command.
    </div>

</div>

<div class="controls">

    <input
        id="textInput"
        type="text"
        placeholder="Type a command..."
    >

    <button
        class="send"
        onclick="sendText()"
    >
        ➤
    </button>

</div>

<button
    class="mic"
    id="mic"
    onclick="startListening()"
>
    🎙️
</button>

<footer>
    ARYAN AI • Mobile Assistant
</footer>

</div>

<script>

const statusText =
document.getElementById("status");

const mic =
document.getElementById("mic");

const chat =
document.getElementById("chat");

const input =
document.getElementById("textInput");


/* -----------------------------
   CHAT
----------------------------- */

function addMessage(text,type){

    const message =
    document.createElement("div");

    message.className =
    "message " + type;

    message.textContent =
    text;

    chat.appendChild(message);

    chat.scrollTop =
    chat.scrollHeight;
}


/* -----------------------------
   VOICE
----------------------------- */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const voice =
    new SpeechSynthesisUtterance(text);

    voice.rate = 1;
    voice.pitch = 1;
    voice.volume = 1;

    speechSynthesis.speak(voice);
}


/* -----------------------------
   COMMAND ENGINE
----------------------------- */

function processCommand(command){

    if(!command)
        return;

    addMessage(command,"user");

    statusText.textContent =
    "Thinking...";

    setTimeout(
        () => handleCommand(command),
        300
    );
}


/* -----------------------------
   COMMAND HANDLER
----------------------------- */

function handleCommand(command){

    const text =
    command.toLowerCase().trim();

    let reply = "";


    /* GREETING */

    if(
        text.includes("hello") ||
        text.includes("hi aryan") ||
        text.includes("hey aryan")
    ){

        reply =
        "Hello! I am ARYAN AI. How can I help you?";

    }


    /* TIME */

    else if(
        text.includes("what time") ||
        text === "time" ||
        text.includes("current time")
    ){

        reply =
        "The current time is " +
        new Date().toLocaleTimeString();

    }


    /* DATE */

    else if(
        text.includes("today's date") ||
        text.includes("what is the date") ||
        text === "date"
    ){

        reply =
        "Today's date is " +
        new Date().toLocaleDateString();

    }


    /* OPEN YOUTUBE */

    else if(
        text === "youtube" ||
        text.includes("open youtube") ||
        text.includes("launch youtube")
    ){

        reply =
        "Opening YouTube.";

        openWebsite(
            "https://www.youtube.com"
        );

    }


    /* PLAY ON YOUTUBE */

    else if(
        text.startsWith("play ") ||
        text.includes("play ") &&
        text.includes("youtube")
    ){

        let query =
        text
        .replace("play","")
        .replace("on youtube","")
        .replace("youtube","")
        .trim();

        if(query){

            reply =
            "Searching YouTube for " +
            query;

            searchYouTube(query);

        }else{

            reply =
            "What should I play on YouTube?";

        }

    }


    /* SEARCH YOUTUBE */

    else if(
        text.includes("search youtube")
    ){

        let query =
        text
        .replace("search youtube for","")
        .replace("search youtube","")
        .trim();

        if(query){

            reply =
            "Searching YouTube for " +
            query;

            searchYouTube(query);

        }else{

            reply =
            "What should I search for on YouTube?";

        }

    }


    /* GOOGLE SEARCH */

    else if(
        text.startsWith("search ") ||
        text.startsWith("google ")
    ){

        let query =
        text
        .replace("search for","")
        .replace("search","")
        .replace("google","")
        .trim();

        if(query){

            reply =
            "Searching Google for " +
            query;

            searchGoogle(query);

        }else{

            reply =
            "What should I search for?";

        }

    }


    /* OPEN GOOGLE */

    else if(
        text.includes("open google")
    ){

        reply =
        "Opening Google.";

        openWebsite(
            "https://www.google.com"
        );

    }


    /* OPEN GITHUB */

    else if(
        text.includes("open github")
    ){

        reply =
        "Opening GitHub.";

        openWebsite(
            "https://github.com"
        );

    }


    /* OPEN PORTFOLIO */

    else if(
        text.includes("open my website") ||
        text.includes("open portfolio")
    ){

        reply =
        "Opening your portfolio.";

        openWebsite(
            "https://aryanpandeyofficial.github.io/"
        );

    }


    /* WHO ARE YOU */

    else if(
        text.includes("who are you") ||
        text.includes("what are you")
    ){

        reply =
        "I am ARYAN AI, your personal mobile assistant.";

    }


    /* HELP */

    else if(
        text === "help" ||
        text.includes("what can you do")
    ){

        reply =
        "I can open YouTube, search YouTube, search Google, tell you the time and date, open websites, and respond to voice commands.";

    }


    /* UNKNOWN */

    else{

        reply =
        "I heard you say: " +
        command +
        ". My advanced AI brain will handle questions like this in the next upgrade.";

    }


    addMessage(reply,"ai");

    speak(reply);

    statusText.textContent =
    "Ready";
}


/* -----------------------------
   YOUTUBE
----------------------------- */

function searchYouTube(query){

    const url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(query);

    openWebsite(url);
}


/* -----------------------------
   GOOGLE
----------------------------- */

function searchGoogle(query){

    const url =
    "https://www.google.com/search?q=" +
    encodeURIComponent(query);

    openWebsite(url);
}


/* -----------------------------
   OPEN WEBSITE
----------------------------- */

function openWebsite(url){

    window.open(
        url,
        "_blank"
    );
}


/* -----------------------------
   TEXT COMMAND
----------------------------- */

function sendText(){

    const text =
    input.value.trim();

    if(!text)
        return;

    input.value = "";

    processCommand(text);
}


/* ENTER KEY */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            sendText();
        }

    }
);


/* -----------------------------
   MICROPHONE
----------------------------- */

function startListening(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        const message =
        "Voice recognition is not supported in this browser. Try Chrome.";

        addMessage(message,"ai");

        speak(message);

        return;
    }


    const recognition =
    new SpeechRecognition();


    recognition.lang =
    "en-IN";


    recognition.continuous =
    false;


    recognition.interimResults =
    false;


    recognition.onstart =
    function(){

        mic.classList.add(
            "listening"
        );

        statusText.textContent =
        "Listening...";

    };


    recognition.onresult =
    function(event){

        const command =
        event
        .results[0][0]
        .transcript;

        processCommand(command);

    };


    recognition.onerror =
    function(){

        mic.classList.remove(
            "listening"
        );

        statusText.textContent =
        "Microphone error";

    };


    recognition.onend =
    function(){

        mic.classList.remove(
            "listening"
        );

        if(
            statusText.textContent ===
            "Listening..."
        ){

            statusText.textContent =
            "Ready";

        }

    };


    recognition.start();
}

</script>

</body>
    </html>
