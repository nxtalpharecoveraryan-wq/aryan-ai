<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYAN AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#05060a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:500px;
    min-height:100vh;
    padding:25px 18px;
    display:flex;
    flex-direction:column;
}

header{
    text-align:center;
    margin-top:15px;
}

header h1{
    font-size:30px;
    letter-spacing:5px;
}

header p{
    margin-top:7px;
    color:#888;
    font-size:13px;
}

.core-area{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.core{
    width:190px;
    height:190px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:radial-gradient(circle,#182a45 0%,#0b1422 45%,#05060a 70%);
    box-shadow:
        0 0 25px #1677ff,
        0 0 70px rgba(22,119,255,.45),
        inset 0 0 35px #1677ff;
    animation:pulse 3s infinite;
}

.core::before,
.core::after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:1px solid #2588ff;
}

.core::before{
    width:220px;
    height:220px;
    animation:rotate 8s linear infinite;
}

.core::after{
    width:250px;
    height:250px;
    opacity:.3;
    animation:rotate 12s linear infinite reverse;
}

.eye{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#55b8ff;
    box-shadow:0 0 30px #159cff;
}

.status{
    margin-top:45px;
    color:#65baff;
    font-size:14px;
    text-align:center;
}

.chat{
    height:150px;
    overflow-y:auto;
    margin:15px 0;
    padding:10px;
}

.message{
    padding:10px 13px;
    margin:7px 0;
    border-radius:15px;
    max-width:85%;
    font-size:14px;
    line-height:1.4;
}

.ai{
    background:#101a29;
    border:1px solid #193b62;
}

.user{
    background:#1260b5;
    margin-left:auto;
}

.controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input{
    flex:1;
    background:#10131a;
    border:1px solid #263444;
    border-radius:25px;
    padding:14px;
    color:white;
    outline:none;
}

button{
    border:0;
    cursor:pointer;
}

.send{
    width:50px;
    border-radius:50%;
    background:#126fe8;
    color:white;
    font-size:18px;
}

.mic{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#116fe8;
    color:white;
    font-size:28px;
    box-shadow:0 0 25px rgba(17,111,232,.7);
    margin:auto;
}

.mic.listening{
    background:#e82245;
    box-shadow:0 0 35px rgba(232,34,69,.8);
    animation:micPulse 1s infinite;
}

footer{
    text-align:center;
    color:#555;
    font-size:11px;
    padding:8px;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
}

@keyframes micPulse{
    50%{transform:scale(1.12)}
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>ARYAN AI</h1>
    <p>PERSONAL AI ASSISTANT</p>
</header>

<div class="core-area">

    <div class="core">
        <div class="eye"></div>
    </div>

    <div class="status" id="status">
        Tap the microphone and speak
    </div>

</div>

<div class="chat" id="chat">
    <div class="message ai">
        Hello! I am ARYAN AI. How can I help you?
    </div>
</div>

<div class="controls">
    <input id="textInput" placeholder="Type a command...">
    <button class="send" onclick="sendText()">➤</button>
</div>

<button class="mic" id="mic" onclick="startListening()">🎙️</button>

<footer>
    ARYAN AI • Voice Assistant
</footer>

</div>

<script>

const statusText = document.getElementById("status");
const mic = document.getElementById("mic");
const chat = document.getElementById("chat");
const input = document.getElementById("textInput");

let recognition;

function addMessage(text,type){

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

function speak(text){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const voice = new SpeechSynthesisUtterance(text);

        voice.rate = 1;
        voice.pitch = 1;
        voice.volume = 1;

        speechSynthesis.speak(voice);
    }
}

function respond(text){

    text = text.toLowerCase();

    let reply = "";

    if(text.includes("hello") || text.includes("hi")){

        reply = "Hello! I am ARYAN AI. Nice to talk with you.";

    }

    else if(text.includes("time")){

        reply = "The current time is " +
        new Date().toLocaleTimeString();

    }

    else if(text.includes("date")){

        reply = "Today is " +
        new Date().toLocaleDateString();

    }

    else if(text.includes("open youtube")){

        reply = "Opening YouTube.";

        window.open("https://www.youtube.com","_blank");

    }

    else if(
    text.includes("play ") &&
    text.includes("youtube")
){

    let query = text
        .replace("play","")
        .replace("on youtube","")
        .replace("youtube","")
        .trim();

    if(!query){
        reply = "What should I play on YouTube?";
    }else{

        reply = "Searching YouTube for " + query;

        window.open(
            "https://www.youtube.com/results?search_query="
            + encodeURIComponent(query),
            "_blank"
        );
    }
}

else if(text.startsWith("play ")){

    let query = text
        .replace("play","")
        .trim();

    if(query){

        reply = "Searching YouTube for " + query;

        window.open(
            "https://www.youtube.com/results?search_query="
            + encodeURIComponent(query),
            "_blank"
        );

    }else{

        reply = "What should I play?";
    }
}

else if(text.includes("search youtube")){

    let query = text
        .replace("search youtube for","")
        .replace("search youtube","")
        .trim();

    if(query){

        reply = "Searching YouTube for " + query;

        window.open(
            "https://www.youtube.com/results?search_query="
            + encodeURIComponent(query),
            "_blank"
        );

    }else{

        reply = "What do you want me to search for?";
    }
}

else if(text.includes("open youtube")){

    reply = "Opening YouTube.";

    window.open(
        "https://www.youtube.com",
        "_blank"
    );
    }
        

        const query = text
        .replace("search youtube for","")
        .replace("search youtube","")
        .replace("youtube","")
        .trim();

        if(query){

            reply = "Searching YouTube for " + query;

            window.open(
                "https://www.youtube.com/results?search_query="
                + encodeURIComponent(query),
                "_blank"
            );

        }else{

            reply = "Opening YouTube.";

            window.open(
                "https://www.youtube.com",
                "_blank"
            );
        }

    }

    else if(text.includes("search")){

        const query = text
        .replace("search","")
        .trim();

        reply = "Searching for " + query;

        window.open(
            "https://www.google.com/search?q="
            + encodeURIComponent(query),
            "_blank"
        );

    }

    else if(text.includes("who are you")){

        reply = "I am ARYAN AI, your personal voice assistant.";

    }

    else{

        reply = "I heard you say " + text +
        ". My AI brain will be added in the next version.";

    }

    addMessage(reply,"ai");

    speak(reply);

    statusText.textContent = "Ready";
}

function processCommand(text){

    if(!text) return;

    addMessage(text,"user");

    statusText.textContent = "Thinking...";

    setTimeout(function(){

        respond(text);

    },500);
}

function sendText(){

    const text = input.value.trim();

    if(!text) return;

    input.value = "";

    processCommand(text);
}

input.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        sendText();
    }

});

function startListening(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        const message =
        "Sorry, voice recognition is not supported in this browser.";

        addMessage(message,"ai");
        speak(message);

        return;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onstart = function(){

        mic.classList.add("listening");

        statusText.textContent = "Listening...";

    };

    recognition.onresult = function(event){

        const text =
        event.results[0][0].transcript;

        processCommand(text);

    };

    recognition.onerror = function(){

        statusText.textContent =
        "Microphone error. Try again.";

        mic.classList.remove("listening");

    };

    recognition.onend = function(){

        mic.classList.remove("listening");

        if(statusText.textContent === "Listening..."){
            statusText.textContent = "Ready";
        }

    };

    recognition.start();
}

</script>

</body>
    </html>
